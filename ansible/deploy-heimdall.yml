---
# Deploys heimdall (HDMI capture module) to the local Minisforum.
#
# Idempotent: re-running this playbook on a clean host or an already-set-up
# host should both succeed without side effects beyond the desired state.
- name: Deploy heimdall (HDMI capture module)
  hosts: agneta
  become: true

  vars:
    heimdall_user: ted

  tasks:
    # --- System packages ---
    - name: Install system packages required by heimdall
      pacman:
        name:
          - ansible        # self-managed: heimdall's deploy tool is itself a managed package
          - ffmpeg         # capture pipeline backbone
          - v4l-utils      # /dev/video* introspection (v4l2-ctl)
          - alsa-utils     # arecord, audio device introspection
          - openbsd-netcat # nc -U for ad-hoc Unix-socket debug from the shell
          # PipeWire stack — required because the Elgato exposes video and
          # audio as the same UVC USB device, and concurrent direct opens of
          # /dev/video0 + ALSA hw:0 starve the v4l2 endpoint at the kernel
          # level. PipeWire holds the raw ALSA device and lets ffmpeg pull
          # audio via the pulse compatibility layer without contention.
          - pipewire
          - pipewire-pulse
          - pipewire-alsa
          - wireplumber
          - python         # heimdall's runtime language
          - python-pip
          - python-numpy
          - git            # for pulling submodule-ish dependencies
        state: present
        update_cache: true

    # --- PipeWire user services ---
    # Enable lingering so heimdall_user's systemd --user manager keeps
    # running without an active login session. Required for headless
    # operation (the box is reached over SSH only).
    - name: Enable systemd lingering for heimdall_user
      command: loginctl enable-linger {{ heimdall_user }}
      args:
        creates: "/var/lib/systemd/linger/{{ heimdall_user }}"

    - name: Enable PipeWire user services for heimdall_user
      become_user: "{{ heimdall_user }}"
      command: systemctl --user enable --now {{ item }}
      loop:
        - pipewire.socket
        - pipewire-pulse.socket
        - wireplumber.service
      environment:
        XDG_RUNTIME_DIR: "/run/user/1000"
      register: pw_enable
      changed_when: "'Created symlink' in (pw_enable.stderr | default(''))"
      failed_when: false

    # NOTE: PipeWire is installed and enabled but heimdall's capture path
    # does not currently use it. Direct ALSA hw:0 + v4l2 /dev/video0 work
    # fine when held by *separate* processes. See the 2026-04-08 session
    # note in loki/docs/sessions/ for the test results that established
    # this. PipeWire is kept here as a sensible default for the box and
    # as a fallback option if we ever need audio multiplexing.

    # --- Device access (no sudo needed at runtime) ---
    - name: Add heimdall user to video group (UVC /dev/video* access)
      user:
        name: "{{ heimdall_user }}"
        groups: video
        append: true

    - name: Add heimdall user to audio group (ALSA capture access)
      user:
        name: "{{ heimdall_user }}"
        groups: audio
        append: true

    - name: Add heimdall user to input group (foot pedal /dev/input access)
      user:
        name: "{{ heimdall_user }}"
        groups: input
        append: true

    # --- Verify the Elgato is actually present ---
    - name: Probe for Elgato Game Capture Neo on USB
      command: lsusb -d 0fd9:008c
      register: elgato_probe
      changed_when: false
      failed_when: false

    - name: Warn if Elgato is not currently plugged in
      debug:
        msg: "WARNING: Elgato Game Capture Neo (0fd9:008c) not found on USB. Plug it in before running capture."
      when: elgato_probe.rc != 0

    - name: Confirm /dev/video0 exists when Elgato is present
      stat:
        path: /dev/video0
      register: video0_stat
      when: elgato_probe.rc == 0

    - name: Show /dev/video0 status
      debug:
        msg: "/dev/video0 present: {{ video0_stat.stat.exists | default(false) }}"
      when: elgato_probe.rc == 0

    # --- Install heimdall daemon, systemd template, and per-instance configs ---
    - name: Install heimdall.py to /usr/local/bin/heimdall
      copy:
        src: ../src/heimdall.py
        dest: /usr/local/bin/heimdall
        owner: root
        group: root
        mode: '0755'
      notify: restart heimdall meeting

    - name: Install heimdall@.service systemd template unit
      copy:
        src: ../systemd/heimdall@.service
        dest: /etc/systemd/system/heimdall@.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - reload systemd
        - restart heimdall meeting

    - name: Ensure /etc/heimdall config directory exists
      file:
        path: /etc/heimdall
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install heimdall@meeting environment file
      copy:
        src: ../systemd/meeting.env
        dest: /etc/heimdall/meeting.env
        owner: root
        group: root
        mode: '0644'
      notify: restart heimdall meeting

    - name: Install heimdall@ted.env.example (placeholder, not active)
      copy:
        src: ../systemd/ted.env.example
        dest: /etc/heimdall/ted.env.example
        owner: root
        group: root
        mode: '0644'

    - name: Force any pending systemd reloads / restarts before enabling
      meta: flush_handlers

    - name: Enable and start heimdall@meeting.service
      systemd:
        name: heimdall@meeting.service
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: true

    - name: restart heimdall meeting
      systemd:
        name: heimdall@meeting.service
        state: restarted
        daemon_reload: true
      failed_when: false
